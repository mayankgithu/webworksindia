<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#10131A">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/crm.css">
<title>Set a new password — Web Works India CRM</title></head>
<body><div class="auth"><div class="auth-art"><a class="logo" href="/" style="color:#fff"><i>W</i>Web Works India</a><div><h1>Set a new password.</h1></div><span></span></div>
<div class="auth-main"><div class="auth-card"><h2>New password</h2><p>At least 8 characters.</p>
<form id="rf" novalidate><div class="field"><label for="p1">New password</label><input id="p1" name="password" type="password" autocomplete="new-password" required></div>
<div class="field"><label for="p2">Type it again</label><input id="p2" type="password" autocomplete="new-password" required></div>
<button class="btn btn--block" type="submit" style="padding:11px">Save password</button></form></div></div></div>
<script>
const show=m=>{rf.querySelector('.err')?.remove();const p=document.createElement('p');p.className='err';p.textContent=m;rf.prepend(p)};
rf.onsubmit=async e=>{e.preventDefault();if(p1.value!==p2.value)return show('The passwords don\'t match.');
const r=await fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')||'',password:p1.value})});
const j=await r.json().catch(()=>({}));if(!r.ok)return show(j.error||'Something went wrong.');location.href='/crm/app.html'};
</script></body></html>
